    disabled: "Автоскидання попереджень вимкнено."
    status_enabled: "Автоскидання попереджень наразі ввімкнено."
    status_enabled_with_time: "Автоскидання попереджень наразі ввімкнено. Попередження користувачів будуть скидатися через {time}."
    status_disabled: "Автоскидання попереджень наразі вимкнено."
    not_configured: "Автоскидання попереджень не налаштоване для цього чату."
